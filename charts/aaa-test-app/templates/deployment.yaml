apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deploymentName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.deploymentName }}
spec:
  replicas: {{ .Values.deploymentReplicas }}
  selector:
    matchLabels:
      app: {{ .Values.deploymentName }}
  template:
    metadata:
      labels:
        app: {{ .Values.deploymentName }}
    spec:
      containers:
      - name: c1-{{ .Values.deploymentName }}
        image: {{ .Values.deploymentImage }}
        command:
        - /bin/bash
        - -c
        - |
          echo "Hello World"
          sleep 86400
        resources:
          requests:
            memory: {{ .Values.requestsMemory | quote }}
            cpu: {{ .Values.requestsCPU | quote }}
          limits:
            memory: {{ .Values.limitsMemory | quote }}
            cpu: {{ .Values.limitsCPU | quote }}